<div id="loginView" class="hidden">
  <form class="login" id="loginForm">
    <img src="img/logo.png" alt="IK Mates">
    <h1>Panel de administración</h1>
    <input type="email" id="email" placeholder="Correo" autocomplete="username" required>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary full" type="submit">Ingresar</button>
  </form>
</div>
